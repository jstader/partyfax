<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Photobooth wall</title>
<link rel="stylesheet" href="/booth/booth.css?v=3">
</head>
<body class="wall">
<header>
  <h1 id="title">Photobooth</h1>
  <a href="/">Back to the booth</a>
</header>
<p id="note" class="note"></p>
<ul id="strips" class="strips"></ul>

<!-- One strip, full size, opened from the wall (#<strip id>). -->
<section id="detail" class="detail" hidden>
  <p><a href="#" id="back">&larr; All strips</a></p>
  <img id="detail-img" class="strip" alt="Photo strip">
  <div class="actions">
    <button id="save" class="big">Save or share</button>
    <a id="download" class="button-link" download>Download</a>
    <button id="again" class="quiet">Print another</button>
  </div>
  <p id="detail-status" class="note" role="status"></p>
</section>
<script type="module" src="/booth/wall.js?v=4"></script>
</body>
</html>
