<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Photobooth admin</title>
<link rel="stylesheet" href="/booth/booth.css?v=7">
</head>
<body class="admin">
<main>
  <h1>Photobooth events</h1>
  <p id="note" class="note" role="status"></p>

  <section id="list-view">
    <ul id="events" class="events"></ul>
    <button id="new">New event</button>
  </section>

  <section id="edit-view" hidden>
    <p><button id="back" class="quiet">&larr; All events</button></p>
    <div class="admin-grid">
      <form id="form" class="event">
        <label for="f-title">Title</label>
        <input id="f-title" type="text" maxlength="40" required>
        <label for="f-subtitle">Subtitle (optional)</label>
        <input id="f-subtitle" type="text" maxlength="60" placeholder="e.g. 18 October 2026">
        <label for="f-font">Font</label>
        <select id="f-font"></select>
        <label for="f-frame">Frame</label>
        <select id="f-frame"></select>
        <label>Icons: how many of each, up to 6 in all</label>
        <div id="f-icons" class="icon-picks"></div>
        <label>Countdown, in seconds</label>
        <div class="toggles">
          <label><input id="f-count-first" type="number" min="1" max="15" class="icon-count"> before the first photo</label>
          <label><input id="f-count-next" type="number" min="1" max="15" class="icon-count"> between the others</label>
        </div>
        <div class="toggles">
          <label><input id="f-active" type="checkbox"> Open (guests can print)</label>
          <label><input id="f-wall" type="checkbox"> Wall on</label>
        </div>
        <div class="row">
          <button type="submit" id="save">Save</button>
          <button type="button" id="test">Print a test strip</button>
        </div>
        <div id="saved-only" hidden>
          <h2>Guest link</h2>
          <p class="note">Scanning the QR code or opening the link goes straight to the booth, no code to type.</p>
          <div class="share">
            <canvas id="qr" class="qr" width="200" height="200" aria-label="QR code for the guest link"></canvas>
            <div>
              <input id="link" type="text" readonly aria-label="Guest link">
              <div class="row">
                <button type="button" id="copy">Copy link</button>
                <button type="button" id="share" hidden>Share...</button>
                <button type="button" id="show-sign">Print sign</button>
              </div>
              <p class="note">Code: <span id="code-text" class="code"></span></p>
            </div>
          </div>
          <div class="row">
            <button type="button" id="new-code" class="quiet">New code</button>
            <button type="button" id="delete" class="quiet">Delete event</button>
          </div>
        </div>
      </form>
      <div class="preview-col">
        <canvas id="preview" class="strip"></canvas>
        <p class="note">Preview with stand-in photos.</p>
      </div>
    </div>

    <h2>Strips</h2>
    <p><button id="download-all" type="button">Download all (zip)</button></p>
    <ul id="strips" class="admin-strips"></ul>
  </section>

  <!-- Outside the editor, so printing can show it alone (booth.css @media print). -->
  <div id="sign" class="sign" hidden>
    <div id="sign-title" class="sign-title"></div>
    <p class="sign-lead">Photobooth</p>
    <canvas id="sign-qr" class="sign-qr" width="400" height="400"></canvas>
    <p>Scan with your phone's camera</p>
    <p class="sign-alt">or open <strong>photobooth.nilanet.live</strong> and enter</p>
    <div id="sign-code" class="big-code"></div>
  </div>
</main>
<script src="/booth/vendor/qrcode-1.4.4.js"></script>
<script type="module" src="/booth/admin/admin.js?v=4"></script>
</body>
</html>
