<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111111">
<title>Photobooth</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='4' width='14' height='10' rx='2' fill='%23000'/%3E%3Ccircle cx='8' cy='9' r='3' fill='%23fff'/%3E%3Crect x='5' y='2' width='6' height='3' fill='%23000'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/booth/booth.css?v=11">
</head>
<body>
<main>
  <!-- One screen at a time; booth.js shows them. -->
  <section id="screen-code" class="screen">
    <canvas id="code-art" class="pixel-art" width="96" height="96" aria-hidden="true"></canvas>
    <h1>Photobooth</h1>
    <p>Scan the QR code on the sign, or type its code here.</p>
    <form id="code-form" autocomplete="off">
      <input id="code" inputmode="text" autocapitalize="characters" spellcheck="false" maxlength="9" placeholder="ABC 234" aria-label="Event code">
      <button type="submit">Go</button>
    </form>
    <p id="code-error" class="error" role="alert"></p>
  </section>

  <section id="screen-ready" class="screen" hidden>
    <!-- The event's look: its frame style, font, icons and a sample strip. -->
    <div id="hero" class="hero">
      <canvas id="hero-icons" class="pixel-art" aria-hidden="true"></canvas>
      <h1 id="event-title"></h1>
      <p id="event-subtitle" class="sub"></p>
      <div class="sample-box">
        <canvas id="sample" class="sample-strip" aria-label="An example of the strip you'll get"></canvas>
      </div>
    </div>
    <p class="how">Four photos, a few seconds apart. Then it prints.</p>
    <button id="enter" class="big">Enter the photobooth</button>
    <p class="links"><a id="wall-link" href="/wall" hidden>See everyone's strips</a></p>
  </section>

  <section id="screen-camera" class="screen camera" hidden>
    <div class="viewfinder">
      <video id="video" playsinline muted></video>
      <div id="count" class="count" aria-live="assertive"></div>
      <div id="flash" class="flash"></div>
    </div>
    <ol id="thumbs" class="thumbs"></ol>
    <p id="camera-note" class="note"></p>
  </section>

  <section id="screen-review" class="screen" hidden>
    <!-- The same top bar as a strip's own page (/strip). -->
    <nav class="toolbar">
      <div class="tool-group">
        <button id="print" class="tool primary">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3h10v6M7 17H4v-8h16v8h-3M7 14h10v7H7z"/></svg>
          Print it
        </button>
        <button id="retake" class="tool">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/></svg>
          Retake
        </button>
      </div>
    </nav>
    <p id="print-status" class="note" role="status"></p>
    <div class="strip-box">
      <canvas id="preview" class="strip"></canvas>
    </div>
  </section>

  <section id="screen-done" class="screen" hidden>
    <h1>Printed!</h1>
    <p>Grab your strip from the printer.</p>
    <button id="again" class="big">Take another</button>
    <p class="links"><a id="wall-link-done" href="/wall" hidden>See everyone's strips</a></p>
  </section>
</main>
<script type="module" src="/booth/booth.js?v=5"></script>
</body>
</html>
