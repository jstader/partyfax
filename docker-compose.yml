# One door, and it opens outwards: cloudflared dials Cloudflare and carries
# requests back to Caddy, which routes / to the site, /api/* to the gateway
# and /mqtt to the broker. Nothing publishes a port, so nothing on the LAN or
# the internet can reach any of this except through the tunnel, and
# /internal/* stays inside the compose network.

name: fax

# Built on the box that runs it (deploy/update.sh), not pulled: the images are
# small Go builds, and building here means no registry login to keep.

# json-file never rotates by default, and a full disk takes Caddy down with
# everything else. 30 MB per service is months of history here.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

# Nothing here needs a capability unless it says so below.
x-hardening: &hardening
  restart: unless-stopped
  logging: *logging
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  cloudflared:
    <<: *hardening
    # Pinned: an unpinned tunnel client can change under a restart.
    image: cloudflare/cloudflared:2026.10.1
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      # From Zero Trust > Networks > Tunnels. Left empty, cloudflared
      # restart-loops without blocking the rest of the stack.
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    read_only: true
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [edge]
    depends_on: [caddy]

  caddy:
    <<: *hardening
    # Stock Caddy plus the rate_limit plugin; see deploy/caddy/Dockerfile.
    image: partyfax/caddy:local
    build:
      context: ./deploy/caddy
    # Port 80 inside the container, reached only by cloudflared.
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 128m
    environment:
      FAX_BANNED: "${FAX_BANNED:-}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv/web:ro
      - caddy-data:/data
    # Through Caddy to the gateway: the gateway's image is scratch and has
    # nothing to run a check with, so this covers both.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [edge, app]
    depends_on: [gateway, booth]

  gateway:
    <<: *hardening
    image: partyfax/gateway:local
    build:
      context: ./backend
      dockerfile: cmd/gateway/Dockerfile
    mem_limit: 128m
    command:
      - "-addr=:8080"
      - "-renderer=http://renderer:8081"
      - "-dispatcher=http://dispatcher:8082"
      - "-photos-dir=/var/lib/fax/photos"
      - "-wall-dir=/var/lib/fax/wall"
    # A copy of every printed photo, the way printed text is in the logs.
    # Not rotated: a square photo is under 20 KB, so a full volume is months
    # of strangers away, and it is the only record of what came out.
    # The wall at /prints: every print, one JSON line each, and the ids
    # taken down with deploy/hide.sh. Both are in Proxmox's nightly
    # backup of the container.
    volumes:
      - photos:/var/lib/fax/photos
      - wall:/var/lib/fax/wall
    networks: [app]
    depends_on: [renderer, dispatcher]

  renderer:
    <<: *hardening
    image: partyfax/renderer:local
    build:
      context: ./backend
      dockerfile: cmd/renderer/Dockerfile
    mem_limit: 128m
    read_only: true
    networks: [app]

  dispatcher:
    <<: *hardening
    image: partyfax/dispatcher:local
    build:
      context: ./backend
      dockerfile: cmd/dispatcher/Dockerfile
    mem_limit: 128m
    read_only: true
    command:
      - "-addr=:8082"
      - "-broker=tcp://mosquitto:1883"
      - "-username=${MQTT_USERNAME:-backend}"
      - "-device=${DEVICE_ID:-printer-1}"
    environment:
      MQTT_PASSWORD: "${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/internal/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    # depends_on orders starts, not readiness. The restart policy is what
    # covers the second before mosquitto is listening.
    networks: [app]
    depends_on: [mosquitto]

  booth:
    <<: *hardening
    image: partyfax/booth:local
    build:
      context: ./backend
      dockerfile: cmd/booth/Dockerfile
    mem_limit: 128m
    read_only: true
    command:
      - "-addr=:8083"
      - "-renderer=http://renderer:8081"
      - "-dispatcher=http://dispatcher:8082"
      - "-data-dir=/var/lib/booth"
    environment:
      # The Access application guarding /admin. Unset leaves admin off.
      CF_ACCESS_TEAM_DOMAIN: "${CF_ACCESS_TEAM_DOMAIN:-}"
      CF_ACCESS_AUD: "${CF_ACCESS_AUD:-}"
    # Events and every strip printed. Not rotated; strips are ~15 KB each.
    volumes:
      - booth:/var/lib/booth
    # It fetches Cloudflare Access's signing keys, so it alone of the app
    # services has a way out to the internet (the LAN stays blocked by the
    # host firewall).
    networks: [app, egress]
    depends_on: [renderer, dispatcher]

  mosquitto:
    <<: *hardening
    image: eclipse-mosquitto:2
    # The entrypoint chowns /mosquitto as root, then the broker drops to its
    # own user.
    cap_add: [CHOWN, SETUID, SETGID]
    mem_limit: 64m
    # No published ports: 1883 for the dispatcher and 9001 for Caddy are
    # reachable only from inside this network.
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto/acl:/mosquitto/config/acl:ro
      - ./deploy/mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "1883"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [app]

# cloudflared sits on edge only: it reaches Caddy and nothing behind it.
# app is internal: no route out at all. The renderer reads pictures
# strangers upload; if one ever got the better of it, it could not fetch
# tools or send anything anywhere. Only the booth also joins egress.
networks:
  edge:
  app:
    internal: true
  egress:

volumes:
  booth:
  caddy-data:
  mosquitto-data:
  photos:
  wall:
