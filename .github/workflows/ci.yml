# Tests on every push, and the Pi agent built for the Pi Zero W.
#
# Deploying stays manual (./deploy/update.sh on the container): the LXC has no
# inbound ports, so GitHub cannot reach it, and that is the point.
#
# The agent binary is attached to each run as the `partyfax-agent` artifact,
# and every push to main also replaces it on the `agent-latest` release, where
# pi/install.sh downloads it without needing a GitHub login.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No dependencies: the tests are node's built-in runner.
      - run: npm test

  pi:
    runs-on: ubuntu-latest
    # Write, for the agent-latest release.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: pi
    # The Pi Zero W is ARMv6. Static, so nothing to install on the Pi but the
    # binary itself.
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: arm
      GOARM: "6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pi/go.mod
          cache-dependency-path: pi/go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_SHA::7}" -o partyfax-agent .
      - uses: actions/upload-artifact@v4
        with:
          name: partyfax-agent
          path: pi/partyfax-agent
          retention-days: 30

      # A rolling pre-release, its binary overwritten by every push to main.
      - name: Publish to the agent-latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view agent-latest >/dev/null 2>&1 ||
            gh release create agent-latest --prerelease --target "$GITHUB_SHA" \
              --title "Pi agent (latest main)" \
              --notes "Built from main by ci.yml and replaced on every push. Installed by pi/install.sh."
          gh release upload agent-latest partyfax-agent --clobber
