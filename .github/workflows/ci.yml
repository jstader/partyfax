# Tests on every push, and the Pi agent built for the Pi Zero W.
#
# Deploying stays manual (./deploy/update.sh on the container): the LXC has no
# inbound ports, so GitHub cannot reach it, and that is the point.
#
# The agent binary is attached to each run as the `partyfax-agent` artifact:
# download it from the run's page and scp it to the Pi (pi/README.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No dependencies: the tests are node's built-in runner.
      - run: npm test

  pi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pi
    # The Pi Zero W is ARMv6. Static, so nothing to install on the Pi but the
    # binary itself.
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: arm
      GOARM: "6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pi/go.mod
          cache-dependency-path: pi/go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build -trimpath -ldflags='-s -w' -o partyfax-agent .
      - uses: actions/upload-artifact@v4
        with:
          name: partyfax-agent
          path: pi/partyfax-agent
          retention-days: 30
