# Pubkey only. PermitRootLogin=without-password (the distro default in the
# main sshd_config) already restricts root; this closes the door for any
# future non-root account too.
PasswordAuthentication no

# Nothing here needs a remote display or a forwarded agent; both widen what a
# compromised session can reach. TCP forwarding stays on for admin tunnels.
X11Forwarding no
AllowAgentForwarding no
