// unattended-upgrades only follows Ubuntu's own archive by default, so Docker
// and CrowdSec, from the repos install.sh adds, never updated on their own.
// A drop-in, so an unattended-upgrades package update can't overwrite it.
// A Docker update restarts dockerd and with it every container (restart:
// unless-stopped brings them back).
Unattended-Upgrade::Allowed-Origins:: "Docker:${distro_codename}";
Unattended-Upgrade::Allowed-Origins:: "packagecloud.io/crowdsec/crowdsec:any";
